<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HumanForge</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: #f6f7f9; color: #1d1d1f; display: flex; height: 100vh; }
    #view { flex: 1; position: relative; min-width: 0; }
    #view canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
    #stats { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: #666; }
    #framing { position: absolute; top: 12px; left: 12px; display: flex; gap: 6px; }
    aside { width: 340px; background: #fff; border-left: 1px solid #e3e5e8; overflow-y: auto; padding: 12px 16px 24px; }
    h3 { margin: 18px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: #777; }
    .row { margin: 8px 0; }
    .row label { display: block; font-size: 12px; color: #555; margin-bottom: 4px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    button { border: 1px solid #d5d8dd; background: #fff; border-radius: 14px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; }
    button.on { background: #1d1d1f; color: #fff; border-color: #1d1d1f; }
    .sw { width: 24px; height: 24px; border-radius: 50%; padding: 0; border: 2px solid #fff; box-shadow: 0 0 0 1px #ccc; }
    .sw.on { box-shadow: 0 0 0 2px #1d1d1f; }
    input[type=range] { width: 100%; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    code { display: block; word-break: break-all; font-size: 11px; background: #f1f2f4; padding: 6px; border-radius: 6px; margin-top: 8px; }
    @media (max-width: 700px) { body { flex-direction: column; } #view { height: 55vh; flex: none; } aside { width: 100%; border-left: 0; } }
  </style>
</head>
<body>
  <div id="view">
    <div id="framing"></div>
    <div id="stats"></div>
  </div>
  <aside id="panel"></aside>
  <script type="module" src="./main.ts"></script>
</body>
</html>
