<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open Avatar Human</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 13px/1.4 system-ui, sans-serif; background: #f4f5f7; color: #1d1d1f; display: flex; height: 100vh; }
    #view { flex: 1; position: relative; min-width: 0; }
    #view canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
    #hud { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: #666; }
    #bar { position: absolute; top: 12px; left: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
    #loading { position: absolute; inset: 0; display: grid; place-items: center; color: #666; pointer-events: none; }
    aside { width: 360px; background: #fff; border-left: 1px solid #e3e5e8; overflow-y: auto; padding: 8px 14px 24px; }
    details { border-bottom: 1px solid #eee; padding: 6px 0; }
    summary { cursor: pointer; font-weight: 600; padding: 6px 0; }
    .row { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 8px; margin: 4px 0; }
    .row label { font-size: 12px; color: #555; }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
    button { border: 1px solid #d5d8dd; background: #fff; border-radius: 14px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; }
    button.on { background: #1d1d1f; color: #fff; border-color: #1d1d1f; }
    .sw { width: 22px; height: 22px; border-radius: 50%; padding: 0; border: 2px solid #fff; box-shadow: 0 0 0 1px #ccc; }
    .sw.on { box-shadow: 0 0 0 2px #1d1d1f; }
    input[type=range] { width: 100%; }
    #selfie { position: absolute; right: 12px; top: 12px; display: none; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.2); }
    select { border: 1px solid #d5d8dd; background: #fff; border-radius: 14px; padding: 3px 8px; font: inherit; font-size: 12px; }
    @media (max-width: 760px) { body { flex-direction: column; } #view { height: 55vh; flex: none; } aside { width: 100%; } }
  </style>
</head>
<body>
  <div id="view"><div id="bar"></div><div id="hud"></div><div id="loading">Loading human…</div></div>
  <aside id="panel"></aside>
  <script type="module" src="./human.ts"></script>
</body>
</html>
