<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Avatar Grid</title>
  <style>body { margin: 0; background: #eef1f5; } canvas { display: block; width: 100vw; height: 100vh; }</style>
</head>
<body>
  <canvas id="c"></canvas>
  <script type="module">
    // Contact sheet: /grid.html?framing=face&cols=4#code1,code2,...  (random avatars if no codes)
    import { WebGLRenderer } from 'three';
    import { AvatarStage, decodeAvatar, randomAvatar } from '../src/core';
    const qp = new URLSearchParams(location.search);
    const codes = location.hash.slice(1).split(',').filter(Boolean);
    const configs = codes.length ? codes.map(decodeAvatar) : Array.from({ length: 12 }, () => randomAvatar());
    const cols = Number(qp.get('cols') || 4), rows = Math.ceil(configs.length / cols);
    const canvas = document.getElementById('c');
    const renderer = new WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
    const W = innerWidth, H = innerHeight;
    renderer.setSize(W, H, false);
    renderer.setScissorTest(true);
    const stage = new AvatarStage();
    stage.setFraming(qp.get('framing') || 'body');
    stage.setYaw(Number(qp.get('yaw') || 0));
    const cw = W / cols, ch = H / rows;
    configs.forEach((cfg, i) => {
      const x = (i % cols) * cw, y = H - (Math.floor(i / cols) + 1) * ch;
      renderer.setViewport(x, y, cw, ch);
      renderer.setScissor(x + 1, y + 1, cw - 2, ch - 2);
      stage.setAvatar(cfg, { flatShading: qp.get('flat') !== '0' });
      stage.setSize(cw, ch);
      renderer.render(stage.scene, stage.camera);
    });
  </script>
</body>
</html>
